<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>互传</title>
<style>
  :root {
    --text: #eaf6ff; --sub: #8fb6d6; --dim: #5f809b;
    --blue: #2f8bff; --cyan: #6fd6ff;
    --stroke: rgba(151, 210, 255, .16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 70% at 8% -8%, rgba(47, 139, 255, .32), transparent 60%),
      radial-gradient(90% 50% at 100% 4%, rgba(111, 214, 255, .14), transparent 62%),
      linear-gradient(165deg, #071c33 0%, #04101f 58%, #030c17 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: calc(var(--pocket-safe-top, 0px) + 18px) 16px calc(var(--pocket-safe-bottom, 0px) + 30px);
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 25px; letter-spacing: -.5px; }
  h1 em { font-style: normal; background: linear-gradient(120deg,#6fd6ff,#2f8bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 10.5px; color: var(--dim); margin-top: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #5f809b; display: inline-block; margin-right: 6px; }
  .dot.on { background: #4fe3b0; box-shadow: 0 0 8px rgba(79,227,176,.85); }

  .card {
    position: relative;
    border-radius: 21px; padding: 15px 16px; margin-bottom: 12px;
    border: 1px solid var(--stroke);
    background: linear-gradient(158deg, rgba(17, 45, 80, .72), rgba(6, 19, 36, .58));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 18px 36px rgba(0,3,10,.3);
    backdrop-filter: blur(12px);
  }
  .statusRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .statusRow strong { font-size: 14px; font-weight: 700; }
  .addr { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #9fe9ff; }
  .hint { font-size: 10.5px; color: var(--dim); margin-top: 8px; line-height: 1.6; }

  .section { font-size: 10px; letter-spacing: 1.2px; color: var(--dim); font-weight: 700; margin: 18px 4px 10px; display: flex; align-items: center; gap: 8px; }
  .section span.count { background: rgba(47,139,255,.18); color: #9fe9ff; padding: 2px 8px; border-radius: 999px; letter-spacing: 0; }
  .hintInline { margin-left: auto; font-size: 9.5px; font-weight: 500; letter-spacing: 0; color: var(--dim); }

  .device {
    width: 100%; display: flex; align-items: center; gap: 13px; text-align: left;
    border-radius: 18px; padding: 13px 14px; margin-bottom: 10px; font: inherit; color: inherit;
    border: 1px solid rgba(151, 210, 255, .13);
    background: linear-gradient(158deg, rgba(14, 40, 70, .66), rgba(5, 18, 34, .52));
    transition: transform .12s ease, border-color .2s;
  }
  .device:active { transform: scale(.985); border-color: rgba(111, 214, 255, .34); }
  .badge {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(47,139,255,.28), rgba(111,214,255,.12));
    border: 1px solid rgba(151,210,255,.16);
    font-size: 19px;
  }
  .dmeta { flex: 1; min-width: 0; }
  .dmeta strong { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmeta span { display: block; font-size: 10px; color: var(--dim); margin-top: 4px; }
  .go { font-size: 10.5px; font-weight: 800; color: #05203c; background: linear-gradient(120deg,#6fd6ff,#2f8bff); border-radius: 999px; padding: 7px 12px; }

  .empty {
    border: 1px dashed rgba(111,214,255,.28); background: rgba(47,139,255,.05);
    border-radius: 18px; padding: 26px 18px; text-align: center; color: var(--sub);
  }
  .empty .icon { font-size: 26px; margin-bottom: 8px; }
  .empty p { font-size: 10.5px; margin-top: 6px; line-height: 1.6; color: var(--dim); }

  .recent { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid rgba(151,210,255,.08); }
  .recent:last-child { border-bottom: none; }
  .recent .fname { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent .fmeta { font-size: 9.5px; color: var(--dim); }

  .progress {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(6, 22, 40, .96); border-top: 1px solid rgba(151,210,255,.16);
    box-shadow: 0 -18px 40px rgba(0,3,10,.42);
    padding: 14px 18px calc(var(--pocket-safe-bottom, 0px) + 16px);
    display: none;
  }
  .progress.show { display: block; }
  .progress .line { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 9px; color: var(--sub); }
  .bar { height: 6px; border-radius: 999px; background: rgba(111,214,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg,#2f8bff,#6fd6ff); transition: width .2s ease; }
  .refresh { font-size: 11px; color: #c8edff; background: rgba(47,139,255,.16); border: 1px solid rgba(111,214,255,.2); border-radius: 999px; padding: 8px 12px; font-weight: 700; }

  /* ---- 黑 / 白 / 灰极简皮肤 ---- */
  :root { --text:#141414; --sub:#6b6b6b; --dim:#9a9a96; --blue:#141414; --cyan:#6b6b6b; --stroke:#e4e4df; }
  body { background:#f3f5f8; color:#141414; }
  h1 em { background:linear-gradient(120deg,#63A0FF,#3F7DFF); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sub, .hint, .hintInline, .dmeta span, .recent .fmeta { color:#9a9a96; }
  .dot { background:#c9c9c3; }
  .dot.on { background:#22B58F; box-shadow:none; }
  .card, .device { background:#fff; border-color:#e4e4df; box-shadow:none; }
  .statusRow strong, .dmeta strong, .recent .fname { color:#141414; }
  .addr { color:#6b6b6b; }
  .section { color:#9a9a96; }
  .section span.count { background:#141414; color:#fff; }
  .badge { background:#efefec; border-color:#e4e4df; }
  .go { background:#141414; color:#fff; }
  .empty { border-color:#cfcfc9; background:#fff; color:#6b6b6b; }
  .empty p { color:#9a9a96; }
  .recent { border-color:#ecece8; }
  .progress { background:#fff; border-color:#e4e4df; box-shadow:0 -12px 30px rgba(0,0,0,.08); }
  .progress .line { color:#6b6b6b; }
  .bar { background:#efefec; }
  .bar i { background:#141414; }
  .refresh { background:#141414; color:#fff; border-color:#141414; }
</style>
</head>
<body>
<header>
  <div>
    <h1>口袋 <em>互传</em></h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="devName">本机</span> · <span id="addr">正在启动…</span></div>
  </div>
  <button class="refresh" id="refresh">刷新</button>
</header>

<div class="card">
  <div class="statusRow">
    <strong>同一 Wi-Fi 下自动发现</strong>
    <span class="addr" id="portText"></span>
  </div>
  <div class="hint">电脑上双击「口袋电脑端」，手机和电脑就会互相出现。点设备即可选文件直传，不限大小、不压缩。</div>
</div>

<div class="section">附近设备 <span class="count" id="devCount">0</span><span class="hintInline">打开对端口袋后出现</span></div>
<div id="devices"></div>

<div class="section">最近收到 <span class="count" id="recvCount">0</span><span class="hintInline">完整管理用「口袋文件」</span></div>
<div class="card" id="recent"></div>

<div class="progress" id="progress">
  <div class="line"><span id="pName">正在传输…</span><span id="pPercent">0%</span></div>
  <div class="bar"><i id="pBar"></i></div>
</div>

<script>
(function () {
  var devices = [];
  var busy = false;

  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(text) {
    if (text) pocket.ui.toast(text);
  }

  function renderStatus(st) {
    if (!st) return;
    document.getElementById('dot').className = st.running ? 'dot on' : 'dot';
    document.getElementById('devName').textContent = st.deviceName || '本机';
    document.getElementById('addr').textContent = st.running
      ? (st.ip ? st.ip + ':' + st.port : '端口 ' + st.port)
      : '服务未启动，重启口袋试试';
    document.getElementById('portText').textContent = st.running && st.ip ? st.ip + ':' + st.port : '';
  }

  function renderDevices() {
    var box = document.getElementById('devices');
    document.getElementById('devCount').textContent = devices.length;
    if (!devices.length) {
      box.innerHTML = '<div class="empty"><div class="icon">⌁</div><strong>还没发现设备</strong>' +
        '<p>让对端口袋保持打开、连同一个 Wi-Fi；电脑端点桌面「口袋电脑端」</p></div>';
      return;
    }
    box.innerHTML = devices.map(function (d) {
      var mobile = d.platform === 'android';
      return '<button class="device" data-id="' + esc(d.id) + '">' +
        '<div class="badge">' + (mobile ? '📱' : '💻') + '</div>' +
        '<div class="dmeta"><strong>' + esc(d.name) + '</strong>' +
        '<span>' + (mobile ? '手机' : '电脑') + ' · ' + esc(d.host) + ':' + d.port + '</span></div>' +
        '<span class="go">发送</span></button>';
    }).join('');
  }

  function renderRecent(files) {
    var list = (files || []).slice(0, 5);
    document.getElementById('recvCount').textContent = (files || []).length;
    var box = document.getElementById('recent');
    if (!list.length) {
      box.innerHTML = '<div class="hint" style="margin:0">还没有收到文件。别人选中这台手机发送后，会出现在这里。</div>';
      return;
    }
    box.innerHTML = list.map(function (f) {
      return '<div class="recent"><div class="fname">' + esc(f.name) + '</div>' +
        '<div class="fmeta">' + fmtSize(f.size) + ' · ' + esc(f.peer || '') + '</div></div>';
    }).join('');
  }

  function fmtSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function fmtSpeed(bytesPerSec) {
    var v = bytesPerSec || 0;
    if (v <= 0) return '';
    if (v < 1024) return v + ' B/s';
    if (v < 1048576) return (v / 1024).toFixed(1) + ' KB/s';
    return (v / 1048576).toFixed(1) + ' MB/s';
  }

  function showProgress(name, percent, speed, direction) {
    var box = document.getElementById('progress');
    box.classList.add('show');
    var prefix = direction === 'in' ? '正在接收 ' : '正在发送 ';
    document.getElementById('pName').textContent = prefix + (name || '…');
    var speedText = fmtSpeed(speed);
    document.getElementById('pPercent').textContent =
      (percent || 0) + '%' + (speedText ? ' · ' + speedText : '');
    document.getElementById('pBar').style.width = (percent || 0) + '%';
  }

  function hideProgress() {
    document.getElementById('progress').classList.remove('show');
  }

  async function refresh() {
    try {
      var st = await pocket.transfer.status();
      renderStatus(st);
      devices = await pocket.transfer.devices();
      renderDevices();
      var files = await pocket.files.list({ direction: 'in' });
      renderRecent(files);
    } catch (e) {
      toast(e.message || '刷新失败');
    }
  }

  async function sendTo(deviceId) {
    if (busy) return;
    busy = true;
    showProgress('选择文件…', 0);
    try {
      var result = await pocket.transfer.pickAndSend(deviceId);
      var count = (result && result.sent) ? result.sent.length : 0;
      toast('已发送 ' + count + ' 个文件');
    } catch (e) {
      if (!(e && e.code === 'E_CANCELLED')) toast(e.message || '发送失败');
    }
    busy = false;
    hideProgress();
    refresh();
  }

  document.getElementById('devices').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-id]') : null;
    if (btn) sendTo(btn.getAttribute('data-id'));
  });
  document.getElementById('refresh').addEventListener('click', refresh);

  pocket.on('transfer.progress', function (p) {
    if (!p) return;
    showProgress(p.name, p.percent || 0, p.speed || 0, p.direction || 'out');
  });
  pocket.on('transfer.received', function (data) {
    var name = data && data.file ? data.file.name : '';
    showProgress(name, 100, 0, 'in');
    setTimeout(hideProgress, 900);
    toast(name ? '收到 ' + name : '收到新文件');
    refresh();
  });

  pocket.ui.keepScreenOn(true);
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
