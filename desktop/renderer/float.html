<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口袋悬浮窗</title>
<link rel="stylesheet" href="float.css">
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4.5"/><path d="m6.8 9.7 5.2-5.2 5.2 5.2"/><path d="M4.5 16.5v1.7c0 1.2 1 2.3 2.3 2.3h10.4c1.3 0 2.3-1.1 2.3-2.3v-1.7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3.8 11.2 11.2-2.8 1.2-3.3 3.3-1.2 2.8L4.7 8.1l2.8-1.2 3.3-3.3L9 3.8Z"/><path d="m8.6 15.4-4.8 4.8"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11.2A8 8 0 0 0 6.2 6.1L4 8.2"/><path d="M4 4.2v4h4"/><path d="M4 12.8a8 8 0 0 0 13.8 5.1l2.2-2.1"/><path d="M20 19.8v-4h-4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.2" y="8.2" width="11" height="11" rx="2.6"/><path d="M6 16h-.5A2.5 2.5 0 0 1 3 13.5v-8A2.5 2.5 0 0 1 5.5 3h8A2.5 2.5 0 0 1 16 5.5V6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.5 3.5 9.8 14.2"/><path d="M20.5 3.5 14.2 20.5l-4.4-6.3-6.3-4.4L20.5 3.5Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 0 0 6.3 6.4L4 8.6"/><path d="M4 4.5v4.1h4.1"/><path d="M4 12.5a8 8 0 0 0 13.7 5.1l2.3-2.2"/><path d="M20 19.5v-4.1h-4.1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="7" height="7" rx="2.2"/><rect x="13.4" y="3.6" width="7" height="7" rx="2.2"/><rect x="3.6" y="13.4" width="7" height="7" rx="2.2"/><rect x="13.4" y="13.4" width="7" height="7" rx="2.2"/></symbol>
</svg>

<div class="fw" id="fw">
  <header class="fwHead">
    <div class="fwBrand">
      <span class="fwLogo">
        <img class="markLight" src="../assets/pocket-icon.png" alt="">
        <img class="markDark" src="../assets/pocket-p-dark.png" alt="">
      </span>
      <span class="fwWords"><strong>口袋悬浮窗</strong><small id="fwStatus">连接中…</small></span>
    </div>
    <div class="fwActions">
      <button class="fwIcon on" id="pinBtn" title="总在最前"><svg class="ico"><use href="#i-pin"></use></svg></button>
      <button class="fwIcon" id="closeBtn" title="关闭"><svg class="ico"><use href="#i-close"></use></svg></button>
    </div>
  </header>

  <div class="fwTabs" id="fwTabs">
    <span class="fwPill" id="fwPill"></span>
    <button data-tab="files" class="active">文件</button>
    <button data-tab="clip">剪贴板</button>
  </div>

  <div class="fwPanels">
    <section class="fwPane active" data-pane="files">
      <button class="fwDevice" id="fwDevice">
        <i class="dot" id="fwDot"></i>
        <span id="fwDeviceName">选择手机</span>
        <small id="fwDeviceMeta">未发现</small>
      </button>

      <div class="fwDrop" id="fwDrop">
        <span class="fwDropIcon"><svg class="ico"><use href="#i-upload"></use></svg></span>
        <strong>拖文件到这里</strong>
        <span>松开即发到手机</span>
        <button class="fwPick" id="fwPick">选择文件</button>
        <input type="file" id="fwFileInput" multiple hidden>
      </div>

      <div class="fwProgressList" id="fwProgress"></div>
      <div class="fwLive" id="fwLive"></div>
    </section>

    <section class="fwPane" data-pane="clip">
      <div class="fwClipActions">
        <button id="fwClipRefresh"><svg class="ico"><use href="#i-refresh"></use></svg>刷新</button>
        <button id="fwClipPush"><svg class="ico"><use href="#i-send"></use></svg>发送电脑剪贴板</button>
      </div>
      <div class="fwClipList" id="fwClipList"></div>
    </section>
  </div>

  <footer class="fwFoot"><span class="fwDotMini" id="fwFootDot"></span><span id="fwFootText">同一 Wi-Fi · 不压缩</span></footer>
  <div class="fwToast" id="fwToast"></div>
  <span class="fwOrb" aria-hidden="true"></span>
</div>
<script src="float.js"></script>
</body>
</html>
